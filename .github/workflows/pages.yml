name: Publish frontend
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public files
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          allowed={'.git','.github','.nojekyll','README.md','index.html','app.js','styles.css','tool-storage.js','cover.png','account-config.json'}
          assert {p.name for p in Path('.').iterdir()} <= allowed
          assert not any(Path('.').rglob('protected-tools'))
          PYCODE
      - name: Prepare frontend
        run: |
          mkdir -p _site
          cp index.html app.js styles.css tool-storage.js cover.png account-config.json .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
